const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

const ITER = 310000;
async function deriveKEK(pass, salt, iter) {

}

  return s; // 0..5
}

/* Cash-flow line chart (one axis, three scenarios, hover crosshair) */
function cashChart(el, res) {
  if (!el) return;
  const w = Math.max(300, Math.floor(el.clientWidth || 640)), small = w < 480, h = small ? 270 : 330;
  const m = {l: small ? 46 : 58, r: small ? 62 : 92, t: 14, b: 34};
  const S3 = [{k: 'down', l: 'Downside', d: '7 5', c: 'var(--c-down)', w: 2}, {k: 'base', l: 'Base case', d: '', c: 'var(--c-base)', w: 3}, {k: 'up', l: 'Upside', d: '2 4', c: 'var(--c-up)', w: 2}];
  const pts = k => [{t: 0, cash: res[k].cash0}, ...res[k].rows.map(r => ({t: r.t, cash: r.cash}))];
  const all = S3.flatMap(s => pts(s.k).map(p => p.cash));
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); const pad = (hi - lo) * .08 || 1000; lo -= pad; hi += pad;
  const step = (() => { const raw = (hi - lo) / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw); })();
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = t => m.l + (w - m.l - m.r) * t / 36, Y = v => m.t + (h - m.t - m.b) * (1 - (v - y0) / (y1 - y0));
  let g = `<rect x="${m.l}" y="${Y(0)}" width="${w - m.l - m.r}" height="${Math.max(0, h - m.b - Y(0))}" fill="var(--neg)"/>`;
  for (let v = y0; v <= y1 + 1; v += step) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`;
  for (let t = 0; t <= 36; t += 6) g += `<text x="${X(t)}" y="${h - 14}" text-anchor="middle" font-size="11" fill="var(--muted)">${t === 0 ? 'Open' : 'M' + t}</text>`;
  g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.5"/><text x="${m.l + 4}" y="${Y(0) - 5}" font-size="10.5" fill="var(--ink2)" font-weight="600">Cash-out line (SAR 0)</text>`;

  ends.forEach(e => g += `<text x="${w - m.r + 6}" y="${e.y + 4}" font-size="11.5" font-weight="700" fill="var(--ink)">${e.s.l}</text><circle cx="${w - m.r}" cy="${Y(e.v)}" r="3.5" fill="${e.s.c}" stroke="var(--surface)" stroke-width="2"/>`);
  [['down', 'Downside'], ['base', 'Base'], ['up', 'Upside']].forEach(([k]) => { const r = res[k]; if (r.runway < 36 && r.cash0 >= 0) { const t = r.runway + 1; g += `<circle cx="${X(t)}" cy="${Y(0)}" r="5" fill="var(--b-fail)" stroke="var(--surface)" stroke-width="2"/>`; } });
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Projected cash balance over 36 months under downside, base and upside scenarios. Table below gives the values." style="display:block;touch-action:pan-y"><g>${g}</g><line id="xh" y1="${m.t}" y2="${h - m.b}" stroke="var(--ink)" stroke-dasharray="3 3" style="display:none"/><rect x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}" fill="transparent" id="hit"/></svg>`;

    xh.setAttribute('x1', X(t)); xh.setAttribute('x2', X(t)); xh.style.display = '';
    const val = k => t === 0 ? res[k].cash0 : res[k].rows[t - 1].cash;
    tip.innerHTML = `<b>${t === 0 ? 'At opening' : 'Month ' + t}</b><br>Upside: ${sar(val('up'))}<br>Base: <b>${sar(val('base'))}</b><br>Downside: ${sar(val('down'))}`;
    tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 240, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };

      const name = $('#s_name').value.trim(), un = $('#s_user').value.trim(), p = $('#s_pass').value;
      if (p !== $('#s_pass2').value) return toast('Passcodes do not match.', true);
      if (strength(p) < 3) return toast('Choose a stronger passcode (longer, with mixed characters).', true);
      $('button[type=submit]', f).disabled = true; await createVault(name, un, p); S.gate = 'login'; S.focusMain = true; render(); toast('Vault created. Welcome!');
    } else if (f.dataset.form === 'login') {
      const b = $('#l_btn'); b.disabled = true; b.textContent = 'Unlocking…';
      try { await doLogin($('#l_user').value, $('#l_pass').value); S.view = {name: 'dash'}; S.focusMain = true; S.last = Date.now(); render(); }
      catch (err) { $('#l_err').textContent = err.message; b.disabled = false; b.textContent = 'Unlock'; $('#l_pass').value = ''; $('#l_pass').focus(); }
    } else if (f.dataset.form === 'adduser') {
      const name = $('#u_name').value.trim(), un = $('#u_user').value.trim().toLowerCase(), role = $('#u_role').value, p = $('#u_pass').value;
      if (vault.users.some(u => u.uname === un)) return toast('That username is already taken.', true);
      if (p.length < 10) return toast('Passcode must be at least 10 characters.', true);
      const id = uid(); const w = await wrapFor(S.master, p); vault.users.push({id, uname: un, ...w}); S.data.users[id] = {name, role, created: new Date().toISOString()};
      log(`Added ${ROLE_LABEL[role]} ${name}`); await persist(); render(); toast(`${name} added. Share their temporary passcode privately.`);
    } else if (f.dataset.form === 'chpass') {
      const u = vault.users.find(x => x.id === S.user.id);
      try { await unwrapWith(u, $('#a_old').value); } catch (err) { return toast('Current passcode is incorrect.', true); }
      const np = $('#a_new').value; if (strength(np) < 3) return toast('Choose a stronger passcode.', true);
      Object.assign(u, await wrapFor(S.master, np)); log('Changed own passcode'); await persist(); f.reset(); toast('Passcode updated.');
    }
  } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, true); const b = $('button[type=submit]', f); if (b) b.disabled = false; }
});
addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
if (!vault) S.gate = 'consent';
render();
})();
</script>
</body>
